name: Build & Release

# Publica en Releases de ESTE MISMO repo (privado) — solo vos, como dueño del
# repo, podés bajar los instaladores desde ahí. Vos los reenviás a mano a
# quien quieras compartir la app. GH_TOKEN es el token automático de Actions,
# no requiere ningún secret nuevo.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies + PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python server
        run: pyinstaller server.spec

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Build app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload installer as Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
